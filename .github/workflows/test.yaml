name: Test

on:
  push:
    branches: [ main]
    paths:
      - '.github/workflows/test.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/fit_changedetector/**'
      - 'tests/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/test.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/fit_changedetector/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint with ruff
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      # ruff version pinned here should match the rev in .pre-commit-config.yaml
      - name: Check lint rules
        run: uvx ruff@0.16.3 check .
      - name: Check formatting
        run: uvx ruff@0.16.3 format --check .
  test:
    runs-on: ubuntu-latest
    name: test
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4.1.3

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest -v -rxXs