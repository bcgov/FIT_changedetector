name: Test

on:
  push:
    branches: [ main]
    paths:
      - '.github/workflows/test.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/fit_changedetector/**'
      - 'tests/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/test.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/fit_changedetector/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint with ruff
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      # ruff version pinned here should match the rev in .pre-commit-config.yaml
      - name: Check lint rules
        run: uvx ruff@0.16.3 check .
      - name: Check formatting
        run: uvx ruff@0.16.3 format --check .
  test:
    runs-on: ubuntu-latest
    name: test
    container: ghcr.io/osgeo/gdal:ubuntu-small-${{ matrix.gdal-version }}
    env:
        DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            gdal-version: '3.6.4'
          - python-version: '3.11'
            gdal-version: '3.8.5'
          - python-version: '3.12'
            gdal-version: '3.10.3'
          - python-version: '3.13'
            gdal-version: '3.12.1'
    steps:
      - uses: actions/checkout@v4.1.3

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest -v -rxXs