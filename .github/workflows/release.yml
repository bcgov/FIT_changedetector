name: Publish to PyPI and create release on GitHub

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # setuptools_scm needs full history/tags to derive the version
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Build a binary wheel and a source tarball
      run: uv build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

    # a version-pinned copy of arcgis/ - kept out of dist/ so
    # pypa/gh-action-pypi-publish (which uploads whatever it finds in dist/
    # to PyPI) never sees it
    - name: Build a version-pinned ArcGIS tools archive
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        cp -r arcgis arcgis-dist
        rm -rf arcgis-dist/__pycache__
        sed -i "s/^FIT_CHANGEDETECTOR_SPEC = .*/FIT_CHANGEDETECTOR_SPEC = \"fit_changedetector==${VERSION}\"/" arcgis-dist/changedetector_common.py
        grep -q "fit_changedetector==${VERSION}\"\$" arcgis-dist/changedetector_common.py \
          || { echo "FIT_CHANGEDETECTOR_SPEC substitution failed"; exit 1; }
        (cd arcgis-dist && zip -r "../fit_changedetector-arcgis-tools-${GITHUB_REF_NAME}.zip" .)
    - name: Store the ArcGIS tools archive
      uses: actions/upload-artifact@v7
      with:
        name: arcgis-tools
        path: fit_changedetector-arcgis-tools-*.zip

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fit-changedetector
    permissions:
      contents: read
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: >-
      Create GitHub Release and sign the Python 🐍
      distribution 📦 with Sigstore
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Download the ArcGIS tools archive
      uses: actions/download-artifact@v8
      with:
        name: arcgis-tools
    - name: Determine prerelease flag
      id: prerelease
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        if echo "$VERSION" | grep -Eq '(a|b|rc)[0-9]+$'; then
          echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
        else
          echo "flag=" >> "$GITHUB_OUTPUT"
        fi
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        '${{ github.ref_name }}'
        --repo '${{ github.repository }}'
        --generate-notes
        ${{ steps.prerelease.outputs.flag }}
    - name: Upload the ArcGIS tools archive to the release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release upload
        '${{ github.ref_name }}' fit_changedetector-arcgis-tools-*.zip
        --repo '${{ github.repository }}'
    # Signing is best-effort: it depends on Sigstore's public TUF trust-root
    # infrastructure, which can fail for reasons unrelated to this release
    # (eg tuf.api.exceptions.UnsignedMetadataError). Don't let that block
    # the release itself.
    - name: Sign the dists with Sigstore
      id: sign
      continue-on-error: true
      uses: sigstore/gh-action-sigstore-python@v3.5.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Upload artifact signatures to GitHub Release
      if: steps.sign.outcome == 'success'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release upload
        '${{ github.ref_name }}' dist/**
        --repo '${{ github.repository }}'