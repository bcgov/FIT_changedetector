name: Test

on:
  push:
    branches: [ main]
    paths:
      - '.github/workflows/test.yml'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/fit_changedetector/**'
      - 'tests/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/test.yml'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/fit_changedetector/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: pre-commit
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # setuptools_scm needs full history/tags to derive the version
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Run pre-commit hooks
        run: uvx pre-commit run --all-files
  test:
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        # the ArcGIS tools run the CLI from a Windows venv, currently on
        # Python 3.14 - cover that combination too
        include:
          - os: windows-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # setuptools_scm needs full history/tags to derive the version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest -v -rxXs